<!DOCTYPE html>
<html>
<head>
    <title>Learning Path Recommender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container max-w-md bg-white p-4 rounded shadow">
        <h2 class="mb-4">Course Recommender Prototype</h2>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">What did you think of your last course?</label>
                <textarea class="form-control" name="review_text" rows="4" placeholder="Type your review here..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Get Learning Path</button>
        </form>

        {% if recommendations %}
            <div class="mt-5">
                <h4>Your Recommended Path:</h4>
                <ol class="list-group list-group-numbered mt-3">
                    {% for course in recommendations %}
                        <li class="list-group-item">{{ course }}</li>
                    {% endfor %}
                </ol>
            </div>
        {% endif %}
    </div>
</body>
</html>
