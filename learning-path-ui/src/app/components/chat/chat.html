<div class="chat-container" style="max-width: 600px; margin: 2rem auto; padding: 1rem; border: 1px solid #ccc; border-radius: 8px;">
  <h2>What do you want to learn?</h2>
  <p>Tell the AI your goals, current skill level, and interests.</p>
  
  <textarea 
    [(ngModel)]="userMessage" 
    rows="4" 
    style="width: 100%; padding: 10px; margin-bottom: 10px;"
    placeholder="e.g., I know a little Python and want to learn Data Science...">
  </textarea>
  
  <button 
    (click)="sendMessage()" 
    [disabled]="isLoading"
    style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
    {{ isLoading ? 'Generating Path...' : 'Get Learning Path' }}
  </button>
</div>



<app-roadmap 
  *ngIf="parsedData" 
  [pathData]="parsedData">
</app-roadmap>
